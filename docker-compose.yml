# Landing page da palestra — Hostinger VPS.
#
#   cp .env.example .env   (e preencha DOMINIO e TOKEN_ADMIN)
#   docker compose up -d --build
#
# Dois containers:
#   site → Caddy, serve a página e emite o certificado HTTPS
#   api  → grava as inscrições no banco SQLite (sem porta publicada)
#
# A pasta site/ é montada no Caddy, então "git pull" já atualiza a página.
# Mexeu na api/? Aí precisa reconstruir: docker compose up -d --build

services:
  site:
    image: caddy:2-alpine
    container_name: palestra-site
    restart: unless-stopped
    depends_on:
      - api

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3

    # Sem "env_file": ele exige que o arquivo exista e derruba o deploy quando
    # o .env ainda não foi criado. O compose já lê o .env sozinho para
    # substituir as variáveis abaixo — e, se não houver .env, dá para definir
    # as mesmas variáveis no painel da Hostinger.
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO (o dominio do site) no .env ou no painel}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data      # certificados — NÃO apague, senão reemite tudo
      - caddy_config:/config

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./api
    container_name: palestra-api
    restart: unless-stopped

    # Sem "ports": a API só é alcançável pelo Caddy, dentro da rede do compose.
    expose:
      - "3000"

    environment:
      BANCO: /data/inscricoes.db
      TOKEN_ADMIN: ${TOKEN_ADMIN:-}

    volumes:
      - inscricoes:/data      # o banco vive aqui — é o que você faz backup

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  inscricoes:
